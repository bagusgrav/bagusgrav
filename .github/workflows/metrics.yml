name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Berjalan otomatis tiap tengah malam
  workflow_dispatch: # Menambahkan tombol untuk dieksekusi manual

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: "html, css, blade" # Sembunyikan markup agar Python mendominasi
          plugin_languages_details: bytes-size, percentage
          output_action: commit
